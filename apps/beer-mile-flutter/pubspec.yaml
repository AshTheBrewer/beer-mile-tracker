name: beer_mile
description: Beer Mile multi-tenant event tracking app — iOS & Android
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.1

  # Local database (offline-first, no code generation required)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Auth — Clerk via hosted WebView OAuth
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^9.2.2

  # Networking
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # NFC + QR
  nfc_manager: ^3.3.0
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.5
  intl: ^0.19.0
  shared_preferences: ^2.3.3

  # Background sync
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
